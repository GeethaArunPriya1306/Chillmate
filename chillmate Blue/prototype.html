<!DOCTYPE html>
<html>
<head>
<title>ChillMate Dashboard</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#89f7fe,#66a6ff);
}

h1,h2{
    text-align:center;
}

.container{
    width:95%;
    margin:auto;
    padding:10px;
}

/* CARDS */
.card{
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    border-radius:15px;
    padding:15px;
    margin:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
}

/* INPUTS */
input{
    padding:10px;
    margin:8px;
    border-radius:8px;
    border:none;
    width:250px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2e7d32;
}

/* EMOJI */
.emoji{
    font-size:30px;
    margin:5px;
    cursor:pointer;
}

.emoji:hover{
    transform:scale(1.3);
}

/* CHAT */
#chatBox{
    height:180px;
    overflow-y:auto;
    background:rgba(255,255,255,0.3);
    padding:10px;
    border-radius:10px;
}

/* SOUND */
.sound{
    font-size:28px;
    cursor:pointer;
    margin:5px;
}

.sound:hover{
    transform:scale(1.2);
}

/* HIDE DASHBOARD INITIALLY */
#dashboard{
    display:none;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
<h1>💙 ChillMate Login</h1>
<center>
<input type="email" id="email" placeholder="Enter Email"><br>
<input type="password" id="password" placeholder="Enter Password"><br>
<button onclick="login()">Login</button>
</center>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h1>🌿 ChillMate Dashboard</h1>

<!-- SOS TOP -->
<div class="card">
<h2>🚨 Emergency Support</h2>
<center>
<button onclick="sendSOS()">Send SOS Alert</button>
<p id="sosMsg"></p>
</center>
</div>

<!-- GRID LAYOUT -->
<div class="grid">

<!-- LEFT SIDE -->
<div>

<!-- MOOD TRACKER -->
<div class="card">
<h2>😊 Mood Tracker</h2>
<center>
<span class="emoji" onclick="setMood(10)">😁</span>
<span class="emoji" onclick="setMood(8)">😊</span>
<span class="emoji" onclick="setMood(6)">🙂</span>
<span class="emoji" onclick="setMood(5)">😐</span>
<span class="emoji" onclick="setMood(3)">😔</span>
<span class="emoji" onclick="setMood(1)">😢</span>
</center>
<p id="moodResult" style="text-align:center;"></p>
</div>

<!-- STRESS ASSESSMENT (POLL STYLE) -->
<div class="card">
<h2>🧠 Stress Assessment</h2>

<p>1. I feel tired without reason</p>
<label><input type="radio" name="q1" value="0"> No</label>
<label><input type="radio" name="q1" value="1"> Sometimes</label>
<label><input type="radio" name="q1" value="2"> Yes</label>

<p>2. I have trouble sleeping</p>
<label><input type="radio" name="q2" value="0"> No</label>
<label><input type="radio" name="q2" value="1"> Sometimes</label>
<label><input type="radio" name="q2" value="2"> Yes</label>

<p>3. I feel anxious or overthinking</p>
<label><input type="radio" name="q3" value="0"> No</label>
<label><input type="radio" name="q3" value="1"> Sometimes</label>
<label><input type="radio" name="q3" value="2"> Yes</label>

<br><br>
<button onclick="checkStress()">Check Stress</button>
<p id="stressResult"></p>

</div>

</div>

<!-- RIGHT SIDE -->
<div>

<!-- NATURE SOUND -->
<div class="card">
<h2>🎶 Relaxing Sounds</h2>
<center>
<span class="sound" onclick="showSound('Rain 🌧️')">🌧️</span>
<span class="sound" onclick="showSound('Ocean 🌊')">🌊</span>
<span class="sound" onclick="showSound('Forest 🌿')">🌿</span>
<span class="sound" onclick="showSound('Fire 🔥')">🔥</span>
<span class="sound" onclick="showSound('Soft Music 🎶')">🎶</span>
</center>
<p id="soundMsg" style="text-align:center;"></p>
</div>

<!-- CHATBOT -->
<div class="card">
<h2>💬 ChillMate Chatbot</h2>
<div id="chatBox"></div>
<input type="text" id="userInput" placeholder="Share your feeling...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

</div>

</div>

</div>

<script>

function login(){
let e=document.getElementById("email").value;
let p=document.getElementById("password").value;

if(e!=="" && p!==""){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Enter email and password");
}
}

function sendSOS(){
document.getElementById("sosMsg").innerHTML="🚨 SOS Sent! Help is on the way 💙";
}

function setMood(score){
document.getElementById("moodResult").innerHTML="Mood Score: "+score+"/10 🌈";
}

function showSound(name){
document.getElementById("soundMsg").innerHTML="Playing "+name+" (visual only)";
}

/* POLL STRESS */
function checkStress(){

let q1=document.querySelector('input[name="q1"]:checked');
let q2=document.querySelector('input[name="q2"]:checked');
let q3=document.querySelector('input[name="q3"]:checked');

if(!q1||!q2||!q3){
alert("Please answer all questions");
return;
}

let total=parseInt(q1.value)+parseInt(q2.value)+parseInt(q3.value);

let result="";

if(total<=2) result="Low Stress 😊";
else if(total<=4) result="Moderate Stress 😐";
else result="High Stress 😢";

document.getElementById("stressResult").innerHTML="Your Stress Level: "+result;
}

/* CHATBOT */
function sendMessage(){

let input=document.getElementById("userInput").value.toLowerCase();
let chat=document.getElementById("chatBox");

chat.innerHTML+="<p><b>You:</b> "+input+"</p>";

let reply="";

if(input.includes("stress"))
reply="Don't worry buddy 💙 I am here for you. Take a deep breath 🌿";
else if(input.includes("sad"))
reply="It's okay to feel sad. Every storm passes 🌈";
else if(input.includes("tired"))
reply="You deserve rest 🛌 Relax and recharge";
else if(input.includes("alone"))
reply="You are never alone 🤝 I am always here with you";
else if(input.includes("angry"))
reply="Take a deep breath 😌 count 1 to 10 and relax";
else
reply="You are strong 💪 keep going and stay positive ✨";

chat.innerHTML+="<p><b>ChillMate:</b> "+reply+"</p>";

document.getElementById("userInput").value="";
chat.scrollTop=chat.scrollHeight;
}

</script>

</body>
</html>
