<!DOCTYPE html>
<html>
<head>
<title>ChillMate Dashboard</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(120deg,#89f7fe,#66a6ff);
}

h1,h2{text-align:center;}

.container{width:95%;margin:auto;padding:10px;}

.card{
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    border-radius:15px;
    padding:15px;
    margin:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.grid{display:grid;grid-template-columns:1fr 1fr;}

input{padding:10px;margin:8px;border-radius:8px;border:none;width:250px;}

button{
    padding:10px 20px;
    border:none;border-radius:8px;
    background:#4CAF50;color:white;
    cursor:pointer;
}

.emoji{font-size:30px;margin:5px;cursor:pointer;}
.sound{font-size:28px;margin:5px;cursor:pointer;}

#chatBox{
    height:180px;
    overflow-y:auto;
    background:rgba(255,255,255,0.3);
    padding:10px;border-radius:10px;
}

#dashboard{display:none;}
</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
<h1>💙 ChillMate Login</h1>
<center>
<input type="email" id="email" placeholder="Enter Email"><br>
<input type="password" id="password" placeholder="Enter Password"><br>
<button onclick="login()">Login</button>
</center>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h1>🌿 ChillMate Dashboard</h1>

<div class="card">
<h2>🚨 Emergency Support</h2>
<center>
<button onclick="sendSOS()">Send SOS Alert</button>
<p id="sosMsg"></p>
</center>
</div>

<div class="grid">

<!-- LEFT -->
<div>

<div class="card">
<h2>😊 Mood Tracker</h2>
<center>
<span class="emoji" onclick="setMood(10)">😁</span>
<span class="emoji" onclick="setMood(8)">😊</span>
<span class="emoji" onclick="setMood(6)">🙂</span>
<span class="emoji" onclick="setMood(5)">😐</span>
<span class="emoji" onclick="setMood(3)">😔</span>
<span class="emoji" onclick="setMood(1)">😢</span>
</center>
<p id="moodResult"></p>
<p id="savedMood"></p>
</div>

<div class="card">
<h2>🧠 Stress Assessment</h2>

<p>1. I feel tired without reason</p>
<label><input type="radio" name="q1" value="0"> No</label>
<label><input type="radio" name="q1" value="1"> Sometimes</label>
<label><input type="radio" name="q1" value="2"> Yes</label>

<p>2. I have trouble sleeping</p>
<label><input type="radio" name="q2" value="0"> No</label>
<label><input type="radio" name="q2" value="1"> Sometimes</label>
<label><input type="radio" name="q2" value="2"> Yes</label>

<p>3. I feel anxious</p>
<label><input type="radio" name="q3" value="0"> No</label>
<label><input type="radio" name="q3" value="1"> Sometimes</label>
<label><input type="radio" name="q3" value="2"> Yes</label>

<br><br>
<button onclick="checkStress()">Check Stress</button>
<p id="stressResult"></p>
<p id="savedStress"></p>

</div>

</div>

<!-- RIGHT -->
<div>

<div class="card">
<h2>🎶 Relaxing Sounds</h2>
<center>
<span class="sound" onclick="playSound('rain')">🌧️</span>
<span class="sound" onclick="playSound('ocean')">🌊</span>
<span class="sound" onclick="playSound('forest')">🌿</span>
<span class="sound" onclick="playSound('fire')">🔥</span>
<span class="sound" onclick="playSound('music')">🎶</span>
</center>
<p id="soundMsg"></p>
</div>

<div class="card">
<h2>💬 ChillMate Chatbot</h2>
<div id="chatBox"></div>
<input type="text" id="userInput" placeholder="Share your feeling...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

</div>

</div>

</div>

<!-- AUDIO FILES -->
<audio id="rain" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
<audio id="ocean" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
<audio id="forest" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"></audio>
<audio id="fire" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"></audio>
<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"></audio>

<script>

/* LOGIN */
function login(){
let e=document.getElementById("email").value;
let p=document.getElementById("password").value;

if(e!=="" && p!==""){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";

/* load stored data */
document.getElementById("savedMood").innerHTML="Saved Mood: "+localStorage.getItem("mood");
document.getElementById("savedStress").innerHTML="Saved Stress: "+localStorage.getItem("stress");

}else alert("Enter email & password");
}

/* SOS */
function sendSOS(){
document.getElementById("sosMsg").innerHTML="🚨 SOS Sent!";
}

/* MOOD SAVE */
function setMood(score){
document.getElementById("moodResult").innerHTML="Mood Score: "+score+"/10";
localStorage.setItem("mood",score);
}

/* STRESS SAVE */
function checkStress(){
let q1=document.querySelector('input[name="q1"]:checked');
let q2=document.querySelector('input[name="q2"]:checked');
let q3=document.querySelector('input[name="q3"]:checked');

if(!q1||!q2||!q3){
alert("Answer all questions");return;
}

let total=parseInt(q1.value)+parseInt(q2.value)+parseInt(q3.value);
let result="";

if(total<=2) result="Low";
else if(total<=4) result="Moderate";
else result="High";

document.getElementById("stressResult").innerHTML="Stress Level: "+result;
localStorage.setItem("stress",result);
}

/* SOUND PLAY */
function playSound(id){
let sounds=document.querySelectorAll("audio");
sounds.forEach(s=>s.pause());

let audio=document.getElementById(id);
audio.play();

document.getElementById("soundMsg").innerHTML="Playing "+id+" sound 🎶";
}

/* CHATBOT */
function sendMessage(){
let input=document.getElementById("userInput").value.toLowerCase();
let chat=document.getElementById("chatBox");

chat.innerHTML+="<p><b>You:</b> "+input+"</p>";

let reply="";

if(input.includes("stress")) reply="I am here for you 💙 breathe slowly";
else if(input.includes("sad")) reply="It will pass 🌈 stay strong";
else if(input.includes("tired")) reply="Take rest 🛌";
else reply="Stay positive ✨";

chat.innerHTML+="<p><b>ChillMate:</b> "+reply+"</p>";

document.getElementById("userInput").value="";
chat.scrollTop=chat.scrollHeight;
}

</script>

</body>
</html>
